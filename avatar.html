<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avatar — Shoh Cinema</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
}

header {
    background: #111116;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #ff2020;
    font-size: 24px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-weight: bold;
}

.movie-page {
    padding: 50px 6%;
}

.back {
    display: inline-block;
    color: #ff3030;
    text-decoration: none;
    margin-bottom: 30px;
}

.movie-content {
    display: flex;
    gap: 40px;
    max-width: 1100px;
}

.poster {
    width: 300px;
    flex-shrink: 0;
}

.poster img {
    width: 100%;
    border-radius: 12px;
}

.info h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.rating {
    color: #ffc400;
    font-size: 18px;
    margin-bottom: 20px;
}

.meta {
    color: #aaa;
    margin-bottom: 25px;
}

.description {
    color: #ccc;
    line-height: 1.7;
    max-width: 650px;
    margin-bottom: 25px;
}

.watch-button {
    display: inline-block;
    background: #e51b23;
    color: white;
    text-decoration: none;
    padding: 13px 25px;
    border-radius: 7px;
    font-weight: bold;
}

.video {
    margin-top: 50px;
    max-width: 1000px;
}

.video h2 {
    margin-bottom: 20px;
}

.video-box {
    background: #15151b;
    border-radius: 10px;
    padding: 60px 20px;
    text-align: center;
    color: #888;
}

footer {
    margin-top: 60px;
    padding: 30px;
    background: #111116;
    text-align: center;
    color: #777;
}

@media (max-width: 700px) {
    .movie-content {
        flex-direction: column;
    }

    .poster {
        width: 100%;
        max-width: 300px;
    }

    .info h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        SHOH CINEMA
    </div>

    <nav>
        <a href="index.html">Bosh sahifa</a>
        <a href="index.html#kinolar">Kinolar</a>
        <a href="index.html#multfilmlar">Multfilmlar</a>
    </nav>

</header>

<section class="movie-page">

    <a href="index.html" class="back">
        ← Orqaga
    </a>

    <div class="movie-content">

        <div class="poster">

            <img
            src="https://image.tmdb.org/t/p/w500/kyeqWdyUXW608qlYkRqosgbbJyK.jpg"
            alt="Avatar">

        </div>

        <div class="info">

            <h1>Avatar</h1>

            <div class="rating">
                ⭐ 8.5
            </div>

            <div class="meta">
                2009 • Fantastika • HD
            </div>

            <p class="description">
                Avatar — uzoq sayyoradagi Pandora olamida
                kechadigan fantastik sarguzasht filmi.
                Jeyk Salli yangi dunyoda o‘z taqdirini topadi.
            </p>

            <a href="#video" class="watch-button">
                ▶ Filmni ko‘rish
            </a>

        </div>

    </div>

    <div class="video" id="video">

        <h2>🎬 Avatar</h2>

  <iframe
    src="https://drive.google.com/file/d/1X_qjE3vRGc_XpcIbeHhVGy-UAepZ4BRf/preview"
    width="100%"
    height="500"
    allow="autoplay"
    allowfullscreen>
</iframe>

    </div>

</section>

<footer>
    © 2026 Shoh Cinema — Barcha huquqlar himoyalangan.
</footer>

</body>
</html>
